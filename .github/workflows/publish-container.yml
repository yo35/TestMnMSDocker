name: Publish container

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: yo35/testmnms # TODO change image name

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4 # Needed to build the arm64 image version from a linux/amd64 runner.
      - uses: docker/setup-buildx-action@v4

      - name: Read image labels
        id: labels
        run: |
          {
            echo 'labels<<EOF'
            grep -v -e '^\s*#' -e '^\s*$' docker/image_src/labels.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compute image tags and metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index # Needed for metadata to be properly set on multi-platform image.
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
          labels: ${{ steps.labels.outputs.labels }}
          annotations: ${{ steps.labels.outputs.labels }}

      - name: Build image and push
        uses: docker/build-push-action@v7
        with:
          context: docker/image_src
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          provenance: false # Avoid the extra 'unknown/unknown' entry in the image index.
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
